title: Temporal Kotlin – Hands-On Lab
teaser: Build a durable order-fulfillment system with the Temporal Java SDK from Kotlin
  — activities, child workflows, parallel fan-out, the Saga pattern, and cutting Temporal
  Cloud cost.
description: |-
  Eight progressive coding challenges using the Temporal Java SDK from Kotlin. Each challenge drops you into a partially-implemented order fulfillment workflow and asks you to fill in the missing pieces.

  **What you'll build:**

  - **Exercise 1 – Converting a Workflow:** Replace a fragile retry loop with Temporal Activities and a proper Workflow implementation.
  - **Exercise 2 – Child Workflows:** Extract inventory reservation into a dedicated child workflow with its own history and retry boundary.
  - **Exercise 3 – Parallel Activities:** Fan out warehouse checks concurrently with `Async.function()` and `Promise.allOf()`.
  - **Exercise 4 – Local Activities:** Move fast in-process steps to Local Activities to reduce Temporal Cloud Actions.
  - **Exercise 5 – Saga Pattern:** Implement compensating transactions so multi-step workflows clean up after themselves on failure.
  - **Exercise 6a – Timers:** Measure what one execution costs in Event History, then replace a polling loop with a single wait.
  - **Exercise 6b – Payloads:** Move a few hundred KB of business data out of Workflow History without changing the outcome.
  - **Exercise 6c – Heartbeats:** Tune heartbeat frequency to what failure detection needs, and find the setting that actually drives the cost.

  Each challenge includes a **Web UI** tab so you can watch your workflows execute in real time, and a **Solve** button if you get stuck.

  **Prerequisites:** Basic Kotlin familiarity. No prior Temporal experience required — the exercises are self-guided.
